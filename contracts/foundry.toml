[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200

remappings = [
  "chainlink-ccip/=lib/chainlink-ccip/chains/evm/contracts/",
  "@openzeppelin/contracts@5.3.0/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
# Set MAINNET_RPC_URL in your shell (Infura/Alchemy/etc.) to run ParlayAqua fork tests.
mainnet = "${MAINNET_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
